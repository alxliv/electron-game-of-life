<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';">
  <title>Conway's Game of Life</title>

  <link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
  <blockquote cite="https://en.wikipedia.org/wiki/Conway%27s_Game_of_Life">
    The Game of Life, also known simply as Life, is a cellular automaton devised by the British mathematician John Horton Conway in 1970.
    <cite><a title="wikipedia article" href="https://en.wikipedia.org/wiki/Conway%27s_Game_of_Life">-Wikipedia</a></cite>
  </blockquote>
  <hr>
  <div id="wrapper">
    <div id="gridsetup">
      <label for="grid_size">Grid width:</label>
      <input id="grid_size" type="number" min="6" max="100" step="1" value ="24"/>
      <button class="xbutton" id="runbtn">Run</button>
      <button class="xbutton" id="stepbtn">Next</button>
      <button class="xbutton" style="margin-left: 20px;" id="backbtn">Back</button>
      <button class="xbutton" id="clearbtn">Clear</button>

    </div>
    <h3>Alive:
      <div class="numberCircle" id="numAlive">1</div>
      <span style="padding-left: 20px;" >Step:
      <div class="numberCircle" id="currGen">1</div>
      </span>
    </h3>
    <div class="info">Info message</div>
    <div class="success">This is success message!</div>
    <div class="warning">Warning message!</div>
    <table id="grid"></table>
    <br>
    <address>About this program: <a href="https://github.com/alxliv/electron-game-of-life">GitHub</a></address>
  </div>

  <script src="scripts/ex-links.js"></script>
  <script src="scripts/game_of_life.js"></script>
</body>
</html>
